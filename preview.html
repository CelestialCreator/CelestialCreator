<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile preview</title>
<style>
  body { background:#010409; color:#c9d1d9; font-family: -apple-system, sans-serif; padding:24px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#8b949e; font-weight:600; }
  img { display:block; margin-bottom:32px; max-width:100%; }
  .light { background:#fff; padding:16px; border-radius:10px; }
</style>
</head>
<body>
  <h2>dark_mode.svg</h2>
  <img src="dark_mode.svg" alt="dark">
  <h2>light_mode.svg</h2>
  <div class="light"><img src="light_mode.svg" alt="light"></div>
</body>
</html>
